name: Build and testing SEMCode.
on: push

jobs:
  build:
    name: Build and Test SEMCode
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Unit Tests
        run: mvn -Dtest=MyTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Integration Tests
        run: |
          docker build -t database ./db 
          docker run --name world -dp 33060:3306 database
          mvn -Dtest=com.napier.sem.AppIntegrationTest
          docker stop employees
          docker rm employees
          docker image rm database 

      - name: Setup database
        run: |
          docker network create --driver bridge se-methods
          docker build -t world-db ./db
          docker run -d --name db --network se-methods world-db

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Build
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: view logs
        run: docker logs devopscontainer

